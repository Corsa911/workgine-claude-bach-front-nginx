name: workgine-stage1

# Ротация логов, чтобы диск не заполнялся.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://workgine:${POSTGRES_PASSWORD:?Run setup first}@db:5432/workgine
  SECRET_KEY: ${SECRET_KEY:?Run setup first}
  # Фронт и API на одном домене за nginx, поэтому CORS по умолчанию выключен.
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workgine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
      POSTGRES_DB: workgine
    volumes:
      - stage1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workgine -d workgine"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging

  # Разовый шаг: миграции и справочники. api стартует только после его успеха,
  # поэтому несколько копий api никогда не мигрируют базу одновременно.
  migrate:
    build: { context: ., target: runtime }
    image: workgine-api:local
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.seed"]
    environment: *api-env
    healthcheck: { disable: true }
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  api:
    build: { context: ., target: runtime }
    image: workgine-api:local
    restart: unless-stopped
    environment:
      <<: *api-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    image: workgine-frontend:local
    restart: unless-stopped
    logging: *logging

  # Единственная точка входа. api и frontend наружу не публикуются.
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"]
    volumes:
      - ./nginx/templates/00-common.conf.template:/etc/nginx/templates/00-common.conf.template:ro
      - ./nginx/templates/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    logging: *logging

  test-db:
    image: postgres:15-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: isolated_test_only
      POSTGRES_DB: workgine_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d workgine_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    build: { context: ., target: test }
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:isolated_test_only@test-db:5432/workgine_test
      DATABASE_URL: postgresql+asyncpg://test:isolated_test_only@test-db:5432/workgine_test
      SECRET_KEY: isolated-test-secret-which-is-at-least-32-chars
    depends_on:
      test-db: { condition: service_healthy }

volumes:
  stage1_pgdata:
