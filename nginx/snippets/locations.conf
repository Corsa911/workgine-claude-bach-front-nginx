# Маршрутизация одного домена: /api -> FastAPI, всё остальное -> Next.js.
# Внутри location нет add_header, иначе nginx перестанет наследовать
# заголовки безопасности уровня server.

location = /health {
    access_log off;
    proxy_pass http://workgine_api;
    include /etc/nginx/snippets/proxy.conf;
}

location ~ ^/api/v1/auth/(login|register)$ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://workgine_api;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    proxy_pass http://workgine_api;
    include /etc/nginx/snippets/proxy.conf;
}

# Swagger. На сервере выключается в API через DOCS_ENABLED=false.
location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass http://workgine_api;
    include /etc/nginx/snippets/proxy.conf;
}

location / {
    proxy_pass http://workgine_web;
    include /etc/nginx/snippets/proxy.conf;
}
